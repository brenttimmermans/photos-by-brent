version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    # Let new releases age before proposing them; security updates skip this.
    cooldown:
      default-days: 14
      semver-major-days: 30
    groups:
      npm:
        patterns: ["*"]
    ignore:
      # Next is pinned to 15.1.x: 15.2+ breaks the static-export photo modal.
      - dependency-name: next
      - dependency-name: eslint-config-next
